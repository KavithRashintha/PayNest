name: PayNest CI Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Spring Boot Microservices (Java 21 + Maven)
  # -------------------------------------------------------------
  spring-boot-services:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - finance-service
          - gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./${{ matrix.service }}/mvnw

      - name: Run Tests & Verify Build
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean test

  # -------------------------------------------------------------
  # Job 2: AI Agent Service (Python 3.11 + FastAPI + Pytest)
  # -------------------------------------------------------------
  ai-service:
    name: Build & Test (ai-service)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests
        working-directory: ./ai-service
        run: pytest -v

  # -------------------------------------------------------------
  # Job 3: Web Application (React 18 + Vite + TypeScript)
  # -------------------------------------------------------------
  web-frontend:
    name: Build (paynest-web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'paynest-web/package-lock.json'

      - name: Install Dependencies
        working-directory: ./paynest-web
        run: npm ci

      - name: Build Production Bundle (Type-check & Vite build)
        working-directory: ./paynest-web
        run: npm run build

  # -------------------------------------------------------------
  # Job 4: Docker Compose & Image Build Verification
  # -------------------------------------------------------------
  docker-build:
    name: Validate Docker Compose & Builds
    runs-on: ubuntu-latest
    needs: [spring-boot-services, ai-service, web-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build All Container Images
        run: docker compose build --parallel
